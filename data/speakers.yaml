  locations: 
  - Plzeň
  bio: Kája je rodačka z Karlovarského kraje, studuje zdravotnické lyceum na SZŠ a VOŠZ Plzeň a má ráda kvalitní divadlo. Jednou by se chtěla uchýlit v oboru medicíny, kde bude šťastná, ať už jako lékařský či nelékařský pracovník. Chtěla by být pacientům záchytným bodem i nadějí toho, že vše bude v pořádku. Anebo, pokud jim už nijak pomoct nepůjde, být alespoň někým, kdo jim zajistí důstojné odcházení. Vědět je super věc a ačkoliv se to tak zprvu zdát nemusí, na akademické půdě se najde nespočet lidí, kteří jsou ochotni již středoškolským studentům chuť k poznání vědy přikrmit. Stačí mít pouze svou vlastní iniciativu, jít si za svým a nevzdávat to, když nastanou těžké časy. Častokrát se mohou podařit skvělé věci, které mohou jednou někomu zachránit život.
  lectures:
  - title: 'Experimentální rekonstrukce poranění žlučových cest s využitím decelularizované tkáně'

