    kole Středoškolské odborné činnosti se svým projektem zabývajícím se zjednodušením
    tréninku řídících letového provozu pomocí AI. Aktuálně se zaměřuje především na
    informatiku/kybernetiku v letectví, zejména pak konstruováním dronů nebo vývojem
    softwaru v oblasti řízení letového provozu.

